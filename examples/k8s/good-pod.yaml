apiVersion: v1
kind: Pod
metadata:
  name: nginx-compliant
spec:
  containers:
    - name: nginx
      image: nginx:1.25
      securityContext:
        privileged: false
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "512Mi"
      livenessProbe:
        httpGet:
          path: /
          port: 80
